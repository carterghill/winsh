[workspace]
members = ["crates/winsh", "crates/winsh-terminal"]
default-members = ["crates/winsh"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
embed-resource = "3.0.6"
windows-sys = "0.61.2"

[workspace.lints.rust]
unsafe_code = "deny"
