[package]
name = "winsh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A native Windows shell with Bash-compatible syntax."

[dependencies]
regex = "1"
rustyline = { version = "17", default-features = false, features = ["with-file-history", "custom-bindings"] }
same-file = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_Diagnostics_Debug"] }

[lints]
workspace = true
