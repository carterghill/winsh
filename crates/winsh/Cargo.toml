[package]
name = "winsh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A native Windows shell with Bash-compatible syntax."

[dependencies]
regex = "1"
unicode-width = "0.2"
rustyline = { version = "17", default-features = false, features = ["with-file-history", "custom-bindings"] }
same-file = "1"
tempfile = { version = "3.26", default-features = false }
walkdir = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["termios"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1"
windows-sys = { workspace = true, features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
